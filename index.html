<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La guimauve POS</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#39291f;font-family:system-ui,sans-serif}header{background:#a64f2d;color:white;padding:18px;text-align:center}h1{margin:0;font-size:24px}main{max-width:760px;margin:auto;padding:12px}section,.tile{background:white;border:1px solid #ecd9c8;border-radius:14px;padding:14px;margin:12px 0}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:11px;background:#f0dfce;color:#39291f;cursor:pointer}button:disabled{opacity:.45}.primary,.active{background:#a64f2d;color:white}.primary{font-weight:bold}input,select{padding:11px;border:1px solid #d8c5b5;border-radius:9px;max-width:100%}input[type=number]{width:115px}input[type=email],input[type=password]{width:100%}nav{display:flex;gap:6px;overflow-x:auto}nav button{white-space:nowrap;flex:1}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#75675b}.price{font-size:24px;font-weight:800}.item{border:1px solid #e6d4c4;border-radius:12px;padding:12px;margin:12px 0}.counter{display:flex;align-items:center;gap:12px}.counter button{min-width:40px}.extra{padding:8px 0;border-bottom:1px solid #f2e8df}.pill{border-radius:20px;background:#f2e4d6;padding:5px 10px;font-size:12px}.error{color:#b42318}.notice{padding:10px;background:#fff0c2;border-radius:10px;margin:10px 0}.bar{height:12px;background:#ead9ca;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#a64f2d}label{display:block;margin:8px 0} .full{width:100%}
</style></head><body><header><h1>La guimauve 🍡</h1><div>焼きマシュマロ 注文管理</div></header><main>
<section id="login"><h2>スタッフログイン</h2><p class="small">管理者がFirebaseに登録したメールアドレスとPOS専用パスワードを入力してください。</p><form id="loginForm"><label>メールアドレス<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button class="primary full">ログイン</button></form><p id="loginError" class="error"></p></section>
<div id="app" class="hidden"><section><div class="row"><span id="who"></span><button id="logout">ログアウト</button></div><div class="row"><label>表示名<input id="displayName" maxlength="24" placeholder="名前"></label><label>担当<select id="role"><option>受付・会計</option><option>焼き係</option><option>トッピング係</option><option>休憩中</option></select></label></div><button id="saveProfile">名前・担当を保存</button><div id="staffList" class="small"></div></section><div id="connection" class="notice hidden"></div><nav><button data-tab="new" class="active">注文受付</button><button data-tab="orders">注文一覧</button><button data-tab="sales">売上分析</button></nav>
<div id="new"><section><h2>新しい注文</h2><p class="small">同じ内容は数量を増やし、違う内容は商品を追加してください。</p><div id="items"></div><button id="addItem">＋ 別の商品を追加</button><div class="row"><strong>合計</strong><span id="total" class="price">¥500</span></div><label>預かり金（円）<input id="received" type="number" min="0" step="1" inputmode="numeric" placeholder="例：1000"></label><div class="row"><strong>お釣り</strong><strong id="change">未入力</strong></div><button id="submitOrder" class="primary full">会計完了・注文確定</button><p id="orderError" class="error"></p></section></div>
<div id="orders" class="hidden"><section><h2>注文一覧</h2><div id="orderList">読み込み中…</div></section></div>
<div id="sales" class="hidden"><section><h2>売上分析</h2><label>集計間隔<select id="interval"><option value="60">1時間</option><option value="30">30分</option></select></label><div id="salesContent"></div></section></div></div>
</main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,runTransaction,updateDoc,setDoc,serverTimestamp,enableIndexedDbPersistence} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDhBW32CsE7Wa_ucUj7JGztfiyS_4JCNjk',authDomain:'la-guimauve.firebaseapp.com',projectId:'la-guimauve',storageBucket:'la-guimauve.firebasestorage.app',messagingSenderId:'425236849727',appId:'1:425236849727:web:3ab49b74e2e6123e24048a',measurementId:'G-PG2YB65GRM'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
// IndexedDB persistence is best-effort. Pending writes are never treated as paid orders until server confirms.
try{await enableIndexedDbPersistence(db)}catch(e){console.warn('Offline persistence unavailable',e.code)}
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const sauces=['チョコソース','マンゴーソース','ストロベリーソース'],extras=[...sauces,'カラースプレー','クラッカー'],stages=['受付済み','焼き中','トッピング中','完成'];
let items=[],orders=[],staff=[],uid=null,unsubs=[],editing=null,online=navigator.onLine;
function fresh(){return {id:crypto.randomUUID(),quantity:1,sauce:sauces[0],extras:[0,0,0,0,0]}}
function unit(x){return 500+x.extras.reduce((a,b)=>a+Number(b||0),0)*50}
function total(){return items.reduce((s,x)=>s+unit(x)*x.quantity,0)}
function htmlEscape(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderItems(){let root=$('items');root.replaceChildren();items.forEach((it,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row"><strong>商品 ${i+1}</strong><button data-action="remove">削除</button></div><label>個数 <input data-action="quantity" type="number" min="1" max="99" value="${it.quantity}"></label><label>基本ソース<select data-action="sauce">${sauces.map(s=>`<option ${it.sauce===s?'selected':''}>${s}</option>`).join('')}</select></label><strong>追加トッピング（各50円）</strong><div class="extras"></div><p class="row"><span>小計</span><strong>${money(unit(it)*it.quantity)}</strong></p>`;d.querySelector('[data-action=remove]').onclick=()=>{if(items.length>1){items.splice(i,1);renderItems()}};d.querySelector('[data-action=quantity]').onchange=e=>{it.quantity=Math.max(1,Math.min(99,Number(e.target.value)||1));renderItems()};d.querySelector('[data-action=sauce]').onchange=e=>{it.sauce=e.target.value;renderItems()};extras.forEach((name,j)=>{let r=document.createElement('div');r.className='row extra';r.innerHTML=`<span>${name}</span><div class="counter"><button>−</button><strong>${it.extras[j]}</strong><button>＋</button></div>`;let b=r.querySelectorAll('button');b[0].onclick=()=>{it.extras[j]=Math.max(0,it.extras[j]-1);renderItems()};b[1].onclick=()=>{it.extras[j]=Math.min(99,it.extras[j]+1);renderItems()};d.querySelector('.extras').append(r)});root.append(d)});$('total').textContent=money(total());calcChange()}
function calcChange(){let raw=$('received').value;let n=Number(raw);$('change').textContent=raw===''?'未入力':n<total()?'不足 '+money(total()-n):money(n-total())}
$('received').oninput=calcChange;$('addItem').onclick=()=>{items.push(fresh());renderItems()};
function notice(msg){$('connection').textContent=msg;$('connection').classList.toggle('hidden',!msg)}
window.addEventListener('offline',()=>{online=false;notice('オフラインです。新規会計は一時停止しています。')});window.addEventListener('online',()=>{online=true;notice('通信が戻りました。データを確認してください。')});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(err){$('loginError').textContent='ログインできませんでした。メールアドレス・パスワードを確認してください。'}};
$('logout').onclick=()=>signOut(auth);
$('saveProfile').onclick=async()=>{let name=$('displayName').value.trim(),role=$('role').value;if(!name)return alert('名前を入力してください');try{await setDoc(doc(db,'staff',uid),{name,role,updatedAt:serverTimestamp()},{merge:true});alert('保存しました')}catch(e){alert('保存できません。権限を確認してください。')}};
onAuthStateChanged(auth,user=>{unsubs.forEach(f=>f());unsubs=[];uid=user?.uid||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(!user)return;$('who').textContent=user.email||'スタッフ';unsubs.push(onSnapshot(collection(db,'orders'),snap=>{orders=snap.docs.map(d=>({docId:d.id,...d.data(),pending:d.metadata.hasPendingWrites})).sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));renderOrders();renderSales()},err=>notice('注文データを取得できません。Firestoreのルールを確認してください。')));unsubs.push(onSnapshot(collection(db,'staff'),snap=>{staff=snap.docs.map(d=>({uid:d.id,...d.data()}));let mine=staff.find(s=>s.uid===uid);if(mine){if(document.activeElement!==$('displayName'))$('displayName').value=mine.name||'';$('role').value=mine.role||'受付・会計'}$('staffList').textContent=staff.map(s=>`${s.name||'未設定'}：${s.role||'未設定'}`).join(' / ')},()=>{}))});
function showTab(t){['new','orders','sales'].forEach(k=>{$(k).classList.toggle('hidden',k!==t);document.querySelector(`[data-tab="${k}"]`).classList.toggle('active',k===t)})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('submitOrder').onclick=async()=>{if(!online)return alert('通信がないため会計を確定できません');let received=Number($('received').value),sum=total();if($('received').value===''||!Number.isInteger(received)||received<sum)return alert('預かり金を正しく入力してください');let btn=$('submitOrder');btn.disabled=true;$('orderError').textContent='';let payload=items.map(x=>({quantity:x.quantity,sauce:x.sauce,extras:[...x.extras]}));let id=crypto.randomUUID(),createdMs=Date.now();try{await runTransaction(db,async tx=>{let counterRef=doc(db,'meta','counter'),orderRef=doc(db,'orders',id),snap=await tx.get(counterRef),number=(snap.exists()?snap.data().last||0:0)+1;tx.set(counterRef,{last:number});tx.set(orderRef,{number,createdMs,createdAt:serverTimestamp(),items:payload,total:sum,received,status:'受付済み',cancelled:false,createdBy:uid,updatedBy:uid})});items=[fresh()];$('received').value='';renderItems();showTab('orders')}catch(e){$('orderError').textContent='登録に失敗しました。通信とアクセス権限を確認してください。'}finally{btn.disabled=false}};
function renderOrders(){let root=$('orderList');root.replaceChildren();if(!orders.length){root.textContent='まだ注文はありません';return}orders.forEach(o=>{let d=document.createElement('div');d.className='item';let time=new Date(o.createdMs||0).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let summary=(o.items||[]).map((x,i)=>`${i+1}. ${x.quantity}個・${x.sauce} ${x.extras.map((n,j)=>n?extras[j]+'×'+n:'').filter(Boolean).join('、')}`).join('\n');d.innerHTML=`<div class="row"><strong>注文 #${String(o.number||0).padStart(3,'0')}</strong><span class="pill">${htmlEscape(o.cancelled?'取消':o.status)}</span></div><p class="small">${time} / ${money(o.total)} ${o.pending?'（同期中）':''}</p><p style="white-space:pre-line">${htmlEscape(summary)}</p><div class="row controls"></div>`;let controls=d.querySelector('.controls');if(!o.cancelled){let sel=document.createElement('select');stages.forEach(s=>{let opt=document.createElement('option');opt.value=s;opt.textContent=s;opt.selected=s===o.status;sel.append(opt)});sel.onchange=async()=>{try{await updateDoc(doc(db,'orders',o.docId),{status:sel.value,updatedBy:uid})}catch(e){alert('更新できませんでした')}};controls.append(sel);let cancel=document.createElement('button');cancel.textContent='注文取消';cancel.onclick=async()=>{if(confirm('この注文を取り消しますか？ 売上から除外します。'))try{await updateDoc(doc(db,'orders',o.docId),{cancelled:true,updatedBy:uid,cancelledAt:serverTimestamp()})}catch(e){alert('取消できませんでした')}};controls.append(cancel)}root.append(d)})}
function renderSales(){let root=$('salesContent');if(!root)return;let valid=orders.filter(o=>!o.cancelled),sum=valid.reduce((a,o)=>a+o.total,0),units=valid.reduce((a,o)=>a+(o.items||[]).reduce((b,x)=>b+x.quantity,0),0);let period=Number($('interval').value),groups={},sauceCount={},extraCount={};valid.forEach(o=>{let d=new Date(o.createdMs),start=Math.floor((d.getHours()*60+d.getMinutes())/period)*period,key=String(Math.floor(start/60)).padStart(2,'0')+':'+String(start%60).padStart(2,'0');groups[key]=(groups[key]||0)+o.total;(o.items||[]).forEach(x=>{sauceCount[x.sauce]=(sauceCount[x.sauce]||0)+x.quantity;x.extras.forEach((n,j)=>extraCount[extras[j]]=(extraCount[extras[j]]||0)+n*x.quantity)})});root.replaceChildren();let top=document.createElement('div');top.innerHTML=`<p>総売上 <strong class="price">${money(sum)}</strong></p><p>注文組数：${valid.length}組 / 販売数：${units}個</p><p>平均客単価：${money(valid.length?Math.round(sum/valid.length):0)}</p><p>取消件数：${orders.length-valid.length}</p>`;root.append(top);function group(title,obj,isMoney){let h=document.createElement('h3');h.textContent=title;root.append(h);let max=Math.max(1,...Object.values(obj));Object.entries(obj).sort(([a],[b])=>a.localeCompare(b,'ja')).forEach(([k,v])=>{let el=document.createElement('div');el.className='tile';el.innerHTML=`<div class="row"><span>${htmlEscape(k)}</span><strong>${isMoney?money(v):v+'個'}</strong></div><div class="bar"><div style="width:${v/max*100}%"></div></div>`;root.append(el)})}group('時間帯別売上',groups,true);group('基本ソース別販売数',sauceCount,false);group('追加トッピング別販売数',extraCount,false)}$('interval').onchange=renderSales;
items=[fresh()];renderItems();
</script></body></html>
